name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Write SITE/BASE into GITHUB_ENV so `astro.config.mjs` definitely sees them
      - name: Set Pages site + base
        shell: bash
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          echo "SITE=https://${OWNER}.github.io" >> "$GITHUB_ENV"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            echo "BASE=/" >> "$GITHUB_ENV"
          else
            echo "BASE=/${REPO}" >> "$GITHUB_ENV"
          fi
          echo "Deploying with SITE=https://${OWNER}.github.io BASE=/${REPO}"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify base path in build
        shell: bash
        run: |
          echo "BASE is: $BASE"
          head -c 800 dist/index.html
          echo ""
          grep -oE '(href|src)="[^"]+"' dist/index.html | head -30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
